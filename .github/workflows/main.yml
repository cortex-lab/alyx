name: CI, approaching CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - dev

jobs:
  run_jobs:
    runs-on: ubuntu-latest
    # Job level, not step level: these were attached to the last step, so inserting a step
    # above them silently left the one before it with no environment at all.
    env:
      DJANGO_SETTINGS_MODULE: alyx.settings
      APACHE_LOG_DIR: /var/log/alyx
      POSTGRES_HOST: localhost
      COVERAGE_RCFILE: ../setup.cfg
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Build database
        run: psql -c "CREATE DATABASE githubactions;" -U postgres -h localhost -p 5432
        env:
          PGPASSWORD: postgres
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.13'

      - name: Checkout branch
        uses: actions/checkout@v3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_test.txt
        env:
          PIP_USE_MIRRORS: true
      - name: Ruff
        run: |
          ruff check ./alyx
      - name: Run tests
        run: |
          # Owned by the runner, not just world-writable: rotation renames django.log
          # inside this directory, which needs write permission on the directory itself.
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/log/alyx
          cd alyx
          cp ./alyx/environment_template.env ./alyx/.env
          cp ../deploy/app/docker/settings-deploy.py  alyx/settings.py
          cp ../deploy/app/docker/settings_lab-deploy.py  alyx/settings_lab.py
          # The whole suite runs with single sign-on and the public database on. With them off
          # the SSO tests skip themselves, so this is the configuration that skips nothing; it
          # also collects four more admin tests, for the models allauth registers.
          cat >> alyx/settings_lab.py <<'SSO'
          PUBLIC_DATABASE = True
          SSO_ENABLED = True
          SSO_PROVIDER = 'orcid'
          SSO_CREATE_USER = True
          SOCIALACCOUNT_PROVIDERS = {
              'orcid': {'APP': {'client_id': 'ci', 'secret': 'ci'}},
          }
          SSO
          python manage.py collectstatic --noinput --link
          python manage.py makemigrations --check --dry-run
          python manage.py check
          coverage run manage.py test --parallel
          coverage combine
          coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
